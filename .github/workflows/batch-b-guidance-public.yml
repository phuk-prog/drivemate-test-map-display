name: Batch B public guidance before and after
on:
  push:
    branches: ['codex/batch-b-guidance-public-20261024']
    paths: ['components/batch-b-guidance/**', '.github/workflows/batch-b-guidance-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - name: Execute paired real component checks
        run: python3 components/batch-b-guidance/ci/run.py
      - name: Upload public before and after evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-b-guidance-before-after
          path: components/batch-b-guidance/results/comparison.json
          if-no-files-found: error
          retention-days: 30
