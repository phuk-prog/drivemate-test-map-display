name: Public Batch B speeding wiring
on:
  push:
    branches: [codex/batch-b-speeding-wiring-public-20261024]
    paths:
      - 'components/batch-b-speeding-wiring/**'
      - '.github/workflows/batch-b-speeding-wiring-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - name: Verify proposed controller method and exact policy
        run: python3 components/batch-b-speeding-wiring/ci/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-b-speeding-wiring
          path: components/batch-b-speeding-wiring/results/verification.json
          if-no-files-found: error
