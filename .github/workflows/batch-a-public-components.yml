name: Batch A public component tests
on:
  push:
    branches: [main]
    paths: ['components/batch-a/**', 'batches/A-roundabouts-maps-positioning/**', '.github/workflows/batch-a-public-components.yml']
  pull_request:
    paths: ['components/batch-a/**', 'batches/A-roundabouts-maps-positioning/**', '.github/workflows/batch-a-public-components.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - name: Verify contracts and expectation classifications
        run: |
          python3 batches/A-roundabouts-maps-positioning/ci/validate.py
          python3 components/batch-a/ci/validate.py
      - name: Execute baseline and candidate in public (same test suite and road snapshot)
        run: python3 components/batch-a/ci/run.py --fetch-roads
      - name: Publish public comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-a-public-before-after
          path: |
            components/batch-a/results/public-comparison.json
            components/batch-a/source-manifest.json
            components/batch-a/evidence/**
            batches/A-roundabouts-maps-positioning/fixtures/independent-osm-roads.json
          if-no-files-found: error
          retention-days: 30
      - name: Report precise scores
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('components/batch-a/results/public-comparison.json')
          if not p.exists(): raise SystemExit('Comparison missing; no pass claimed')
          r=json.loads(p.read_text());print(json.dumps(r))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Public component checks only; no combined app, APK or legal certification.\n\n')
              for phase,x in r['results'].items():
                  f.write(phase+': '+json.dumps(x['expanded_68_scores'])+'\n\n')
          PY
  android-sensors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install SDK for library-only unit tests
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - name: Test real sensor adapters before and after in public
        run: python3 components/batch-a/ci/run_android.py
      - name: Public sensor comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-a-public-sensors
          path: components/batch-a/results/android-sensor-comparison.json
          if-no-files-found: error
          retention-days: 30
