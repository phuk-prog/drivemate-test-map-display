name: Batch E11 offline update components
on:
  push:
    branches: ['codex/batch-e11-offline-updates-20261024']
    paths: ['batches/E-offline-updates/**', '.github/workflows/batch-e11-offline-updates.yml']
  pull_request:
    paths: ['batches/E-offline-updates/**', '.github/workflows/batch-e11-offline-updates.yml']
permissions:
  contents: read
jobs:
  paired-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - run: python3 batches/E-offline-updates/run.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-e11-paired-components
          path: batches/E-offline-updates/results.json
          if-no-files-found: error
  android-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - run: gradle -p batches/E-offline-updates/android-harness testDebugUnitTest --no-daemon
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-e11-android-scheduler
          path: batches/E-offline-updates/android-harness/build/test-results/testDebugUnitTest
          if-no-files-found: error
