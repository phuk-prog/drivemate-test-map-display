name: Batch C public before and after
on:
  push:
    branches: ['work/batch-c-search-stops-arrival-20261024']
    paths: ['batches/C-search-stops-arrival-first-use/**', '.github/workflows/batch-c-public-components.yml']
  pull_request:
    paths: ['batches/C-search-stops-arrival-first-use/**', '.github/workflows/batch-c-public-components.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - name: Execute identical public source scenario checks before and after
        run: python3 batches/C-search-stops-arrival-first-use/ci/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-c-public-comparison
          path: batches/C-search-stops-arrival-first-use/results/comparison.json
          if-no-files-found: error
