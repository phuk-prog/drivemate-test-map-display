name: Public Batch A viewport-aware regional selection
on:
  push:
    branches: [main]
    paths:
      - "components/region-viewport/**"
      - ".github/workflows/region-viewport-public.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regional-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - name: Test same production region-catalog Kotlin source with synthetic viewport boundaries
        run: python3 components/region-viewport/ci/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-a-region-viewport-selection
          path: components/region-viewport/results/viewport-selection.json
          if-no-files-found: error
          retention-days: 30
