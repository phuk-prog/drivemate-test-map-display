name: Public avoided-road route choices
on:
  push:
    branches: [main]
    paths: ['components/route-alternatives/**', '.github/workflows/route-alternatives-public.yml']
  pull_request:
    paths: ['components/route-alternatives/**', '.github/workflows/route-alternatives-public.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.3'
      - run: python3 components/route-alternatives/ci/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: avoided-road-choice-evidence
          path: components/route-alternatives/results/verification.json
          if-no-files-found: error
